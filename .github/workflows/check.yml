name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  asset-validation:
    name: Asset validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate package publisher
        run: |
          bash -n tools/package-release.sh
          shellcheck tools/*.sh
          test -s paintings/LICENSE
          test -s runtime-paths.txt
          release_tag=$(git describe --tags --abbrev=0)
          tools/package-release.sh "$release_tag" build/validation
          archive="build/validation/atrinik-resources-${release_tag#v}.tar.gz"
          tar -tzf "$archive" >build/validation/contents.txt
          grep -q '/paintings/LICENSE$' build/validation/contents.txt
          ! grep -Eq '/(README.md|CONTRIBUTING.md|tools|release-line.txt)(/|$)' \
            build/validation/contents.txt
