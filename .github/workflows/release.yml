name: Semantic Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-24.04
    container: ghcr.io/atrinik/linux-build:ubuntu-26.04@sha256:6e128d58125dfa0f4553c112ba76616f84aa448728dfc0fc235eb52a1024a53d
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Analyze commits and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          npx --yes
          --package=semantic-release@25.0.9
          --package=@semantic-release/exec@7.1.0
          --package=conventional-changelog-conventionalcommits@9.3.1
          semantic-release
