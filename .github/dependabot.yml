version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - zoeyrose

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
    assignees:
      - zoeyrose
    ignore:
      # v10 requires conventional-changelog-writer 9, but semantic-release's
      # release-notes-generator still resolves writer 8, so release-notes
      # generation fails. Remove once semantic-release supports writer 9.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
